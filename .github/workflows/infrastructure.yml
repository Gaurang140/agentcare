name: infrastructure

# ci.yml validates Terraform source and releases the application. This workflow
# is the only place that runs Terraform against the real Google project, so it
# signs in as its own service account and waits for a reviewer on the
# production-infra environment before any step starts.

on:
  push:
    branches:
      - main
    paths:
      - infra/terraform/**
      # The bootstrap stack holds the state bucket and the identity used below,
      # so an operator applies it with `make gcp-bootstrap` and it is never
      # applied here. It stays in the filter because a change to the roles it
      # grants changes what the plan of the main stack is allowed to do.
      - infra/bootstrap/**
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform operation to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm:
        description: "type destroy to confirm a destroy"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Two runs against one state file would fight over the GCS state lock and the
  # loser would fail. They queue instead, and a run that may be halfway through
  # an apply is never cancelled.
  group: agentcare-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment:
      # Protected with a required reviewer, and it carries the infrastructure
      # variables. The application deploy job keeps the separate production
      # environment and its own narrower deployer identity.
      name: production-infra
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_INFRA_SERVICE_ACCOUNT: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      # Terraform drops its interactive next-step advice from the log.
      TF_IN_AUTOMATION: "1"
    steps:
      - name: check the destroy confirmation
        # The environment reviewer is the first gate. This is the second one: a
        # dispatch that was left on destroy by accident stops here, before the
        # checkout. The input is read through the environment rather than
        # pasted into the script, so its value cannot extend the command.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::type destroy in the confirm input to run a destroy"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          # No later step reads Terraform output as a step output, and the
          # wrapper only gets in the way of exit codes.
          terraform_wrapper: false

      - name: validate infrastructure configuration
        shell: bash
        run: |
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_INFRA_SERVICE_ACCOUNT
            TF_STATE_BUCKET
          )
          for variable in "${required[@]}"; do
            if [ -z "${!variable}" ]; then
              echo "::error::GitHub production-infra variable $variable is missing"
              exit 1
            fi
          done

      - name: authenticate to Google Cloud
        # The action writes a credentials file and exports
        # GOOGLE_APPLICATION_CREDENTIALS, which the google provider reads as
        # application default credentials. The Terraform source needs no
        # credentials argument and no service-account key exists.
        # The workload identity provider only accepts refs/heads/main, so a
        # dispatch has to be started from main. From any other branch the token
        # exchange fails at this step.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT }}

      # Every Terraform call uses -chdir, the same form as the operator runbook
      # in docs/deployment-gcp.md, so the guard above can run before a checkout
      # exists and the plan files stay next to the configuration.
      - name: check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: initialize the remote state
        # The bucket name is a variable because it is globally unique per
        # account, and a backend block cannot interpolate one.
        run: >-
          terraform -chdir=infra/terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"

      - name: validate configuration
        run: terraform -chdir=infra/terraform validate -no-color

      - name: plan
        id: plan
        # inputs.action is empty on a push, so a push to main plans as well. A
        # destroy makes its own plan further down: a create plan there would
        # only add noise and could fail on the drift the destroy removes.
        if: inputs.action != 'destroy'
        # Only the project and the region differ per account. gcs_location, the
        # network names and the feature switches keep the defaults declared in
        # infra/terraform/variables.tf; change them there rather than passing
        # more values from GitHub.
        run: >-
          terraform -chdir=infra/terraform plan -input=false -no-color
          -out=tfplan
          -var="project_id=$GCP_PROJECT_ID"
          -var="region=$GCP_REGION"

      - name: apply
        id: apply
        # A dispatch with action plan stops after the step above. Everything
        # else applies exactly the saved plan, so what runs is what the log
        # shows. A push to main reaches this point only after the environment
        # reviewer approves the run.
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform -chdir=infra/terraform apply -input=false tfplan

      - name: plan the destroy
        # The confirm check is repeated here so the condition reads on its own.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm == 'destroy'
        run: >-
          terraform -chdir=infra/terraform plan -destroy -input=false -no-color
          -out=tfplan-destroy
          -var="project_id=$GCP_PROJECT_ID"
          -var="region=$GCP_REGION"

      - name: destroy
        id: destroy
        # The application resources come down first: `make gcp-down` runs
        # kubectl delete -k on the gcp overlay and purges the documents bucket,
        # which releases the load balancer and lets the bucket be deleted.
        # Google can hold the servicenetworking connection for several days
        # after the Cloud SQL instance is deleted, so a destroy that fails on
        # that connection and its reserved range is not a bug. Retry it later
        # with `make gcp-cleanup`.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm == 'destroy'
        run: terraform -chdir=infra/terraform apply -input=false tfplan-destroy

      - name: record the outcome
        if: always()
        shell: bash
        env:
          RUN_ACTION: ${{ github.event_name == 'push' && 'apply' || inputs.action }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
        run: |
          {
            echo "## infrastructure: $RUN_ACTION"
            echo ""
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| plan | ${PLAN_OUTCOME:-not run} |"
            echo "| apply | ${APPLY_OUTCOME:-not run} |"
            echo "| destroy | ${DESTROY_OUTCOME:-not run} |"
            echo ""
            echo "Project \`$GCP_PROJECT_ID\`, region \`$GCP_REGION\`, state bucket \`$TF_STATE_BUCKET\`, commit \`$GITHUB_SHA\`."
            echo ""
            echo "The full diff is in the plan step's log."
          } >> "$GITHUB_STEP_SUMMARY"
