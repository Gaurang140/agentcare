name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check backend evals

      - name: compile check
        run: python -m compileall backend evals -q

      - name: run tests
        run: PYTHONPATH=backend python -m pytest -q backend evals/test_evidence_safety.py

      - name: verify eval metric fixture
        run: python evals/phase2_score.py --selftest

  # First-party actions are pinned to the current v7 release commits. These
  # releases run on the runner's node24.

  frontend:
    # The backend job never builds the frontend, so a type error or a lint
    # failure in frontend/ only ever surfaced in the Docker build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

  migrations:
    # An empty database migrated all the way to head. The test suite cannot
    # catch a broken revision: it builds its schema straight off the models
    # with Base.metadata.create_all and never runs a migration at all.
    runs-on: ubuntu-latest
    env:
      # Sqlite needs no service container. The revisions are written to run on
      # both backends (backend/alembic/env.py sets render_as_batch), and that
      # env.py reads this variable through app.config.settings.
      DATABASE_URL: sqlite:///./ci-migrations.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          # requirements.txt pulls presidio and two spaCy model wheels (about
          # 27 MB), so this job downloads a lot without the cache.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: migrate an empty database to head
        run: cd backend && alembic upgrade head

      - name: report the revision reached
        run: cd backend && alembic current

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: check formatting
        run: tofu fmt -check -recursive

      - name: initialize providers without remote state
        run: tofu init -backend=false -input=false

      - name: validate configuration
        run: tofu validate -no-color

  manifests:
    # Rendering is not validation: kustomize does no schema check at all.
    # kubeconform validates the rendered output offline against the published
    # Kubernetes JSON schemas, and -strict rejects unknown fields the same way
    # `kubectl apply` does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install kubeconform
        run: |
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          bin_dir="$RUNNER_TEMP/kubeconform-bin"
          curl -sfL \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o "$archive"
          # Published in the v0.8.0 release's CHECKSUMS asset.
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $archive" \
            | sha256sum -c -
          mkdir -p "$bin_dir"
          tar xzf "$archive" -C "$bin_dir" kubeconform
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: validate every overlay
        # -ignore-missing-schemas skips the GKE CRDs (BackendConfig,
        # FrontendConfig, ManagedCertificate and PodMonitoring) that have no
        # published schema; every core resource is still validated strictly.
        run: |
          for overlay in infra/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" \
              | kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.32.0
            echo "::endgroup::"
          done

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks comments its findings on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks reads git history, not just the checked-out tree: a
          # credential that was committed and then removed is still a leaked
          # credential.
          fetch-depth: 0

      - name: gitleaks
        # Pinned to the tagged release commit rather than the moving major
        # tag. Default rule set, no repo config file: the point is the
        # upstream rules, and a local config is a place to quietly allow
        # something through.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only organization-owned repositories need a (free) license key.
          # This one is personal, so the empty value is expected and the scan
          # runs either way.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
