name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Redeploys a known commit on main by hand once the infrastructure has been
  # recreated, without an empty commit to trigger a push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://agentcare_test:agentcare_test@localhost:5432/agentcare_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentcare_test
          POSTGRES_USER: agentcare_test
          POSTGRES_PASSWORD: agentcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check backend evals scripts

      - name: compile check
        run: python -m compileall backend evals scripts -q

      - name: run tests
        run: PYTHONPATH=backend python -m pytest -q backend evals/test_evidence_safety.py

      - name: verify eval metric fixture
        run: python evals/phase2_score.py --selftest

  # First-party actions are pinned to the current v7 release commits. These
  # releases run on the runner's node24.

  frontend:
    # The backend job never builds the frontend, so a type error or a lint
    # failure in frontend/ only ever surfaced in the Docker build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

  migrations:
    # An empty database migrated all the way to head. The test suite cannot
    # catch a broken revision: it builds its schema straight off the models
    # with Base.metadata.create_all and never runs a migration at all.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Sqlite needs no service container. The revisions are written to run on
      # both backends (backend/alembic/env.py sets render_as_batch), and that
      # env.py reads this variable through app.config.settings.
      DATABASE_URL: sqlite:///./ci-migrations.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          # requirements.txt pulls presidio and two spaCy model wheels (about
          # 27 MB), so this job downloads a lot without the cache.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: migrate an empty database to head
        run: cd backend && alembic upgrade head

      - name: report the revision reached
        run: cd backend && alembic current

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: check formatting
        run: terraform fmt -check -recursive

      - name: check bootstrap formatting
        working-directory: infra/bootstrap
        run: terraform fmt -check -recursive

      - name: initialize providers without remote state
        run: terraform init -backend=false -input=false

      - name: validate configuration
        run: terraform validate -no-color

      - name: initialize bootstrap providers without local state
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false

      - name: validate bootstrap configuration
        working-directory: infra/bootstrap
        run: terraform validate -no-color

  manifests:
    # Rendering is not validation: kustomize does no schema check at all.
    # kubeconform validates the rendered output offline against the published
    # Kubernetes JSON schemas, and -strict rejects unknown fields the same way
    # `kubectl apply` does.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install kubeconform
        run: |
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          bin_dir="$RUNNER_TEMP/kubeconform-bin"
          curl -sfL \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o "$archive"
          # Published in the v0.8.0 release's CHECKSUMS asset.
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $archive" \
            | sha256sum -c -
          mkdir -p "$bin_dir"
          tar xzf "$archive" -C "$bin_dir" kubeconform
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: validate every overlay
        # -ignore-missing-schemas skips the GKE CRDs (BackendConfig,
        # FrontendConfig, ManagedCertificate and PodMonitoring) that have no
        # published schema; every core resource is still validated strictly.
        run: |
          for overlay in infra/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" \
              | kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.32.0
            echo "::endgroup::"
          done

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # gitleaks comments its findings on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks reads git history, not just the checked-out tree: a
          # credential that was committed and then removed is still a leaked
          # credential.
          fetch-depth: 0

      - name: gitleaks
        # Pinned to the tagged release commit rather than the moving major
        # tag. Default rule set, no repo config file: the point is the
        # upstream rules, and a local config is a place to quietly allow
        # something through.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only organization-owned repositories need a (free) license key.
          # This one is personal, so the empty value is expected and the scan
          # runs either way.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deploy-production:
    name: deploy production
    needs:
      - test
      - frontend
      - migrations
      - infrastructure
      - manifests
      - secret-scan
    # With DEPLOY_ENABLED unset the expression reads an empty string, so CI
    # stays green before the infrastructure exists.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The migration Job has a 540 second active deadline; leave room for the
    # image build, rollout, and bounded health retries without an unbounded run.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: agentcare-production
      cancel-in-progress: false
      queue: max
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
      DOCUMENTS_BUCKET: ${{ vars.DOCUMENTS_BUCKET }}
      MODEL_ARMOR_TEMPLATE: ${{ vars.MODEL_ARMOR_TEMPLATE }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      LLM_PROFILE: ${{ vars.LLM_PROFILE }}
      LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_SAMPLE_RATE: ${{ vars.LANGFUSE_SAMPLE_RATE }}
      IMAGE_TAG: ${{ github.sha }}
      KUBERNETES_NAMESPACE: agentcare
      REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE_REPOSITORY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agentcare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: validate deployment configuration
        shell: bash
        run: |
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOYER_SERVICE_ACCOUNT
            GKE_CLUSTER
            DOCUMENTS_BUCKET
            MODEL_ARMOR_TEMPLATE
            PUBLIC_URL
            LLM_PROFILE
          )
          for variable in "${required[@]}"; do
            if [ -z "${!variable}" ]; then
              echo "::error::GitHub production variable $variable is missing"
              exit 1
            fi
          done

      - name: authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: "577.0.0"
          install_components: "gke-gcloud-auth-plugin,kubectl"

      - name: authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      # Release tags are immutable in this registry, so rebuilding a commit
      # that already shipped could never repoint its tag. When the tag exists
      # this run reuses the published image, which is exactly what a
      # workflow_dispatch redeploy after infrastructure recreation wants.
      - name: look up existing release images
        id: existing
        shell: bash
        run: |
          for app in backend frontend; do
            digest=$(gcloud artifacts docker images list \
              "$IMAGE_REPOSITORY/$app" \
              --include-tags \
              --filter="tags=$IMAGE_TAG" \
              --limit=1 \
              --format='value(version)')
            echo "$app=$digest" >> "$GITHUB_OUTPUT"
            if [ -n "$digest" ]; then
              echo "$app:$IMAGE_TAG is already published as $digest; its build is skipped"
            fi
          done

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: build and push backend
        id: build-backend
        if: steps.existing.outputs.backend == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=agentcare-backend
          cache-to: type=gha,mode=max,scope=agentcare-backend

      - name: build and push frontend
        id: build-frontend
        if: steps.existing.outputs.frontend == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/frontend:${{ github.sha }}
          build-args: BACKEND_URL=http://backend:8000
          cache-from: type=gha,scope=agentcare-frontend
          cache-to: type=gha,mode=max,scope=agentcare-frontend

      # One release digest per image, whether this run built it or an earlier
      # run published it under the immutable tag.
      - name: resolve release digests
        id: digests
        shell: bash
        env:
          EXISTING_BACKEND: ${{ steps.existing.outputs.backend }}
          EXISTING_FRONTEND: ${{ steps.existing.outputs.frontend }}
          BUILT_BACKEND: ${{ steps.build-backend.outputs.digest }}
          BUILT_FRONTEND: ${{ steps.build-frontend.outputs.digest }}
        run: |
          status=0
          for app in backend frontend; do
            case "$app" in
              backend) digest="${EXISTING_BACKEND:-$BUILT_BACKEND}" ;;
              frontend) digest="${EXISTING_FRONTEND:-$BUILT_FRONTEND}" ;;
            esac
            if [ -z "$digest" ]; then
              echo "::error::no published or freshly built digest for $app"
              status=1
            fi
            echo "$app=$digest" >> "$GITHUB_OUTPUT"
            echo "$app releases as $digest"
          done
          exit "$status"

      - name: get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GCP_REGION }}

      - name: select AgentCare namespace
        run: kubectl config set-context --current --namespace="$KUBERNETES_NAMESPACE"

      - name: render release manifests
        run: >-
          python scripts/render_gcp_manifests.py
          --output "$RUNNER_TEMP/agentcare-k8s"

      - name: preflight namespace-scoped release access
        shell: bash
        run: |
          if ! kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i create deployments --quiet; then exit 1; fi
          if ! kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i patch deployments --quiet; then exit 1; fi
          if ! kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i create jobs --quiet; then exit 1; fi
          if ! kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i delete jobs --quiet; then exit 1; fi
          if ! kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i list events --quiet; then exit 1; fi
          if ! kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i create managedcertificates.networking.gke.io --quiet; then exit 1; fi
          if kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i get secrets --quiet; then exit 1; fi
          if kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i create rolebindings.rbac.authorization.k8s.io --quiet; then exit 1; fi
          if kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i create serviceaccounts --quiet; then exit 1; fi
          if kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i create namespaces --quiet; then exit 1; fi
          if kubectl --namespace="$KUBERNETES_NAMESPACE" auth can-i create pods/exec --quiet; then exit 1; fi

      - name: run database migration
        id: migrate
        shell: bash
        run: |
          set -euo pipefail
          kubectl --namespace="$KUBERNETES_NAMESPACE" delete job backend-migrate --ignore-not-found=true --wait=true
          kubectl --namespace="$KUBERNETES_NAMESPACE" apply -k "$RUNNER_TEMP/agentcare-k8s/overlays/gcp-migration"
          for attempt in {1..120}; do
            echo "migration Job condition check $attempt/120"
            conditions="$(kubectl --namespace="$KUBERNETES_NAMESPACE" get job backend-migrate \
              -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}' || true)"
            if grep -Fxq "Complete=True" <<<"$conditions"; then
              kubectl --namespace="$KUBERNETES_NAMESPACE" logs job/backend-migrate --all-containers=true \
                || echo "::warning::migration completed, but pod logs are unavailable"
              exit 0
            fi
            if grep -Fxq "Failed=True" <<<"$conditions"; then
              echo "::error::database migration Job reported Failed=True"
              kubectl --namespace="$KUBERNETES_NAMESPACE" logs job/backend-migrate --all-containers=true || true
              # A job that never starts writes no logs. Describe includes its
              # events (for example unschedulable, image-pull, and deadline failures).
              kubectl --namespace="$KUBERNETES_NAMESPACE" describe job backend-migrate || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::database migration Job did not become Complete=True or Failed=True within 600 seconds"
          kubectl --namespace="$KUBERNETES_NAMESPACE" logs job/backend-migrate --all-containers=true || true
          kubectl --namespace="$KUBERNETES_NAMESPACE" describe job backend-migrate || true
          exit 1

      - name: deploy application
        id: deploy
        run: |
          kubectl --namespace="$KUBERNETES_NAMESPACE" apply -k "$RUNNER_TEMP/agentcare-k8s/overlays/gcp"
          kubectl --namespace="$KUBERNETES_NAMESPACE" rollout status deployment/backend --timeout=600s
          kubectl --namespace="$KUBERNETES_NAMESPACE" rollout status deployment/frontend --timeout=600s

      # Reads the release identity off the cluster rather than off a version
      # endpoint, because the backend code is fixed and serves no such route.
      - name: verify release identity
        id: verify-release
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
        run: |
          status=0
          for app in backend frontend; do
            case "$app" in
              backend) digest="$BACKEND_DIGEST" ;;
              frontend) digest="$FRONTEND_DIGEST" ;;
            esac
            expected="$IMAGE_REPOSITORY/$app:$IMAGE_TAG"

            # Hard gate: the cluster must request exactly this release tag.
            # The registry's immutable tags pin that tag to the digest above.
            deployed=$(kubectl --namespace="$KUBERNETES_NAMESPACE" get deployment "$app" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='$app')].image}")
            if [ "$deployed" = "$expected" ]; then
              echo "deployment/$app requests $expected"
            else
              echo "::error::deployment/$app requests '$deployed', expected '$expected'"
              status=1
            fi

            # Soft signal only: containerd may report the config digest rather
            # than the index digest the push reported, so a miss here is noise
            # more often than a wrong release. Pods replaced by this rollout
            # can also still be terminating on the old digest.
            image_ids=$(kubectl --namespace="$KUBERNETES_NAMESPACE" get pods -l "app=$app" \
              --field-selector=status.phase=Running \
              -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.imageID}{"\n"}{end}{end}')
            if printf '%s\n' "$image_ids" | grep -Fq "$digest"; then
              echo "a running $app pod reports $digest"
            else
              echo "::warning::no running $app pod reports the release digest $digest"
              echo "image ids reported by running $app pods:"
              printf '%s\n' "$image_ids"
            fi
          done
          exit "$status"

      - name: smoke test public health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl -fsS --max-time 10 "${PUBLIC_URL}/api/health" >/dev/null; then
              exit 0
            fi
            echo "health check attempt $attempt failed; retrying"
            sleep 10
          done
          kubectl --namespace="$KUBERNETES_NAMESPACE" get pods,services,ingress
          exit 1

      - name: write release summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome }}
          ROLLOUT_OUTCOME: ${{ steps.deploy.outcome }}
          RELEASE_CHECK_OUTCOME: ${{ steps.verify-release.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### agentcare release"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| release sha | \`$IMAGE_TAG\` |"
            echo "| backend digest | \`${BACKEND_DIGEST:-not built}\` |"
            echo "| frontend digest | \`${FRONTEND_DIGEST:-not built}\` |"
            echo "| public url | ${PUBLIC_URL:-not set} |"
            echo "| migration | ${MIGRATION_OUTCOME:-did not run} |"
            echo "| rollout | ${ROLLOUT_OUTCOME:-did not run} |"
            echo "| release check | ${RELEASE_CHECK_OUTCOME:-did not run} |"
            echo "| job | $JOB_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
