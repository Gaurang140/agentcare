# Manual GKE deploy: build+push both images, then kubectl apply the
# infra/k8s kustomize overlay. workflow_dispatch only, on purpose - this
# workflow never runs on push or pull_request, so committing it is a no-op
# until someone triggers it by hand, and it needs the repo Variables below
# to exist (they do not by default) before a dispatch run can succeed.
#
# This workflow never reads secrets.SUBMISSION_TOKEN. That token belongs to
# .github/workflows/agentcare-checks.yml (the hackathon's own judging
# pipeline, see .superpowers/sdd/task-6-report.md) and must stay isolated
# from every other workflow in this repo.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "kustomize overlay under infra/k8s/overlays to deploy"
        type: choice
        default: "gcp"
        options:
          - gcp

permissions:
  id-token: write # required for google-github-actions/auth's Workload Identity Federation
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # never cancel a deploy mid-rollout

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPO: agentcare
  KUSTOMIZE_VERSION: "5.8.1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: authenticate to gcp
        uses: google-github-actions/auth@v3
        with:
          # No JSON keys, ever. vars.GCP_WIF_PROVIDER / vars.GCP_DEPLOY_SA are
          # not secrets (a provider resource name and a service account
          # email, both meaningless without this exact repo's identity) -
          # infra/terraform/modules/iam/main.tf pins the WIF provider's
          # attribute_condition to this github_repository, so only a run
          # started from this repo can impersonate the deploy SA.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: configure docker for artifact registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/backend:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/backend:latest

      - name: build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            BACKEND_URL=http://backend:8000
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/frontend:latest

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GCP_GKE_CLUSTER }}
          location: ${{ vars.GCP_GKE_LOCATION }}

      - name: install kustomize
        run: |
          curl -sfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash -s -- "${KUSTOMIZE_VERSION}"
          sudo mv kustomize /usr/local/bin/kustomize

      - name: delete previous migration job
        # Job specs are immutable - a leftover backend-migrate from the last
        # run would otherwise fail this apply outright (see
        # infra/k8s/base/migration-job.yaml).
        run: kubectl delete job backend-migrate --ignore-not-found

      - name: point overlay at the images just pushed
        working-directory: infra/k8s/overlays/${{ inputs.environment }}
        run: |
          kustomize edit set image \
            "agentcare-backend=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/backend:${GITHUB_SHA}" \
            "agentcare-frontend=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/frontend:${GITHUB_SHA}"

      - name: apply
        run: kubectl apply -k "infra/k8s/overlays/${{ inputs.environment }}"

      - name: wait for rollout
        run: |
          kubectl rollout status deployment/backend --timeout=300s
          kubectl rollout status deployment/frontend --timeout=300s

      - name: post-deploy health check (best effort)
        continue-on-error: true
        run: |
          set +e
          INGRESS_IP=$(kubectl get ingress agentcare -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$INGRESS_IP" ]; then
            echo "checking health through ingress ip $INGRESS_IP"
            curl -sf --max-time 10 "http://$INGRESS_IP/api/health"
            RESULT=$?
          else
            echo "no ingress ip yet (or ingress.yaml was not applied) - falling back to port-forward"
            kubectl port-forward svc/backend 8000:8000 &
            PF_PID=$!
            sleep 5
            curl -sf --max-time 10 http://localhost:8000/api/health
            RESULT=$?
            kill "$PF_PID" 2>/dev/null || true
          fi
          if [ "$RESULT" -ne 0 ]; then
            echo "::warning::post-deploy health check failed - inspect 'kubectl logs deployment/backend', this does not fail the deploy"
          fi
