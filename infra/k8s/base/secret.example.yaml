# Template only - deliberately NOT listed in kustomization.yaml's resources,
# so `kubectl apply -k` never touches the real Secret. Every value below is a
# placeholder; none of them are usable credentials.
#
# Create the real Secret out-of-band, once per cluster/namespace, before the
# first `kubectl apply -k`:
#
#   kubectl create secret generic agentcare-secrets \
#     --from-literal=LLM_API_KEY=your_groq_key \
#     --from-literal=LLM_FALLBACK_API_KEY= \
#     --from-literal=JWT_SECRET=a_long_random_string \
#     --from-literal=DATABASE_URL='postgresql+psycopg://user:pass@host:5432/agentcare' \
#     --from-literal=INTERNAL_TASK_TOKEN= \
#     --from-literal=LANGFUSE_SECRET_KEY=
#
# To rotate a value later, update it in place rather than delete+recreate:
#   kubectl create secret generic agentcare-secrets --from-literal=JWT_SECRET=new_value \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: agentcare-secrets
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
  LLM_FALLBACK_API_KEY: ""
  JWT_SECRET: "REPLACE_ME"
  DATABASE_URL: "postgresql+psycopg://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/agentcare"
  INTERNAL_TASK_TOKEN: ""
  LANGFUSE_SECRET_KEY: ""
