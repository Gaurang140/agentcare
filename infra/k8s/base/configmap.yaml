# Non-secret runtime config for the backend, mirrors backend/app/config.py's
# Settings fields. Anything with a credential in it (LLM_API_KEY, JWT_SECRET,
# DATABASE_URL, INTERNAL_TASK_TOKEN, the Langfuse and fallback-LLM keys) lives
# in the Secret instead - see secret.example.yaml for that split.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentcare-config
data:
  LLM_PROFILE: "groq"
  INJECTION_GUARD_MODEL: "meta-llama/llama-prompt-guard-2-86m"
  # Fallback endpoint host/model are not secrets on their own; only the
  # matching API key (in the Secret) is.
  LLM_FALLBACK_BASE_URL: ""
  LLM_FALLBACK_MODEL: ""
  CHECKPOINT_DB_PATH: "checkpoints.db"
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_HOST: ""
  JWT_EXPIRE_MINUTES: "1440"
  STORAGE_BACKEND: "local"
  UPLOAD_DIR: "./uploads"
  GCS_BUCKET: ""
  # Model Armor fills the injection guard's layer-2 slot and screens the
  # drafted answer. The reusable base disables it until the GCP overlay
  # patches in a real template name.
  MODEL_ARMOR_TEMPLATE: ""
  MODEL_ARMOR_LOCATION: "europe-west3"
  ENVIRONMENT: "prod"
  LOG_LEVEL: "INFO"
  # Placeholder: the operator replaces this with the actual frontend origin
  # before rendering. Leaving it in place makes browser API calls fail CORS.
  FRONTEND_ORIGIN: "https://FRONTEND_ORIGIN_PLACEHOLDER"
