apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - backend.yaml
  - frontend.yaml
  - migration-job.yaml
  # secret.example.yaml is intentionally NOT listed here. It is a template
  # for the `kubectl create secret` command in its own comments, not a
  # manifest to apply - including it would make `kubectl apply -k` overwrite
  # the real agentcare-secrets Secret with placeholder values on every
  # deploy. Create the real Secret out-of-band once per cluster (see
  # secret.example.yaml and infra/k8s/README.md).
