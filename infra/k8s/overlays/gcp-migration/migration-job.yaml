# This is the sole Kubernetes migration and seed owner. The long-running
# backend Deployment skips startup migrations.
#
# Job specs are immutable. Delete a prior backend-migrate Job before applying
# this overlay again. ttlSecondsAfterFinished cleans up completed runs
# eventually but does not unblock a still-running Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels:
    app: backend-migrate
spec:
  backoffLimit: 3
  # Below the workflow's 600s wait, so a hung migration dies and fails the
  # release instead of surviving as a zombie after the workflow gives up.
  activeDeadlineSeconds: 540
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: agentcare-backend:replace-by-overlay
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          args: ["python", "-c", "print('migrate+seed done')"]
          envFrom:
            - secretRef:
                name: agentcare-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
