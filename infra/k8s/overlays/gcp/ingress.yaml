# The GCP application overlay includes a public external Application Load
# Balancer. It accrues charges while present; check current pricing before
# applying.
#
# /api/* routes straight to the backend Service so SSE traffic hits the
# BackendConfig's long timeout (backendconfig.yaml) directly, instead of
# passing through the frontend's Next.js rewrite proxy. Everything else goes
# to the frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentcare
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "agentcare-ingress"
    # Domain placeholder - set to a real domain you control before this
    # Ingress can issue a certificate; ManagedCertificate provisioning fails
    # silently (stays "Provisioning") against a domain with no matching DNS.
    networking.gke.io/managed-certificates: "agentcare-cert"
    networking.gke.io/v1beta1.FrontendConfig: "agentcare-frontendconfig"
spec:
  # Avoid GKE's implicit NodePort-based default-http-backend. The Autopilot
  # services below use container-native NEGs, so unmatched traffic belongs on
  # the existing frontend backend as well.
  defaultBackend:
    service:
      name: frontend
      port:
        number: 3000
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agentcare-cert
spec:
  domains:
    - "PUBLIC_HOST_PLACEHOLDER"
