apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentcare

resources:
  - ../../base
  - ingress.yaml
  - backendconfig.yaml
  - frontendconfig.yaml
  - podmonitoring.yaml

patches:
  # Uploads go to a bucket rather than to the pod's own filesystem. Without
  # this the base's STORAGE_BACKEND: "local" survives into the cluster and a
  # replaced pod loses every uploaded document (see the file's own comment).
  - path: configmap-storage.yaml

  # Names the Model Armor template the backend screens against. Without this
  # the base's empty template survives into the cluster and the deployed app
  # runs the deterministic guard layer alone, which is safe but is not what
  # the terraform in infra/terraform/ just paid to create.
  - path: configmap-model-armor.yaml

  # Environment-specific model, origin, release and Langfuse values are
  # rendered into a temporary copy by scripts/render_gcp_manifests.py.
  - path: configmap-runtime.yaml

  # Points the backend Service at the BackendConfig above so the GCE Ingress
  # applies its 3600s timeout to SSE traffic. Only affects traffic through
  # the Ingress, not in-cluster calls (e.g. the frontend's own /api rewrite).
  - target:
      kind: Service
      name: backend
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/backend-config: '{"default": "backend-backendconfig"}'

# The renderer replaces each sentinel with one validated deployment value.
images:
  - name: agentcare-backend
    newName: REGION_PLACEHOLDER-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/agentcare/backend
    newTag: IMAGE_TAG_PLACEHOLDER
  - name: agentcare-frontend
    newName: REGION_PLACEHOLDER-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/agentcare/frontend
    newTag: IMAGE_TAG_PLACEHOLDER
