apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa.yaml
  - ingress.yaml
  - backendconfig.yaml

patches:
  # Points the backend Service at the BackendConfig above so the GCE Ingress
  # applies its 3600s timeout to SSE traffic. Only affects traffic through
  # the Ingress, not in-cluster calls (e.g. the frontend's own /api rewrite).
  - target:
      kind: Service
      name: backend
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/backend-config: '{"default": "backend-backendconfig"}'

# REGION-docker.pkg.dev/PROJECT/agentcare/{backend,frontend} are placeholders.
# CI never edits this file by hand: .github/workflows/deploy.yml runs
# `kustomize edit set image` in this directory to rewrite both name and tag
# to the real Artifact Registry path and the git sha, right before
# `kubectl apply -k`. Local/manual applies should do the same, or edit these
# two entries directly.
images:
  - name: agentcare-backend
    newName: REGION-docker.pkg.dev/PROJECT/agentcare/backend
    newTag: TAG
  - name: agentcare-frontend
    newName: REGION-docker.pkg.dev/PROJECT/agentcare/frontend
    newTag: TAG
