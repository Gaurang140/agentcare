# Model Armor override for the gcp overlay, merged onto the base ConfigMap.
#
# The base ships MODEL_ARMOR_TEMPLATE: "", which disables provider screening
# until this overlay supplies the deployed template name. The deterministic
# injection layer remains active either way (backend/app/safety/model_armor.py).
#
# MODEL_ARMOR_TEMPLATE is a placeholder, the same convention configmap-storage.yaml
# uses for GCS_BUCKET: replace it before applying. The real value is the
# `model_armor_template_name` output from the terraform in infra/terraform/,
# and it is a full resource path, projects/PROJECT/locations/LOCATION/templates/ID.
# Replace the sentinel before rendering. Leaving it in place would silently
# disable the provider layer instead of proving the configured GCP path.
#
# MODEL_ARMOR_LOCATION must match the template and PSC endpoint region. Replace
# REGION alongside the image registry sentinels before rendering.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentcare-config
data:
  MODEL_ARMOR_TEMPLATE: "MODEL_ARMOR_TEMPLATE_PLACEHOLDER"
  MODEL_ARMOR_LOCATION: "REGION_PLACEHOLDER"
