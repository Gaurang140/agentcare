              command: ["python", "-m", "app.jobs"]
              args: ["recovery"]
              envFrom:
                - configMapRef:
                    name: agentcare-config
                - secretRef:
                    name: agentcare-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
