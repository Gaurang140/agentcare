apiVersion: batch/v1
kind: CronJob
metadata:
  name: send-due-reminders
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: reminders
              image: agentcare-backend:replace-by-overlay
              command: ["python", "-m", "app.jobs"]
              args: ["reminders"]
              envFrom:
                - configMapRef:
                    name: agentcare-config
                - secretRef:
                    name: agentcare-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recover-stalled-workflows
spec:
