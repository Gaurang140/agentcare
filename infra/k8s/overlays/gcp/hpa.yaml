# Backend only: it runs the LangGraph agent orchestration and any LLM-bound
# work, so it is the piece whose load actually varies with traffic. The
# frontend is a stateless Next.js SSR server with a small, roughly constant
# footprint - scale what needs scaling, not both Deployments by default.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
